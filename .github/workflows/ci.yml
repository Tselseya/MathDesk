# Builds and type-checks every pull request (for example Dependabot's), so a broken update is caught
# before it is merged. It never deploys anything. No secrets are needed: missing VITE_* values just
# make the build skip optional features.
name: CI (type-check and build)

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
